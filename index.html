<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Квадрат">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<title>Магический квадрат</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Caveat используется только для рукописной картинки на canvas -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app" class="app" data-mode="date">

  <div class="segmented" role="radiogroup" aria-label="Режим">
    <input type="radio" name="mode" id="modeNormal" value="normal">
    <label for="modeNormal">Обычный квадрат</label>

    <input type="radio" name="mode" id="modeDate" value="date" checked>
    <label for="modeDate">Дата рождения</label>

    <span class="segmented-thumb" aria-hidden="true"></span>
  </div>

  <div class="card">
    <div id="grid" class="grid"></div>
  </div>

  <p id="hint" class="hint">Введи дату рождения</p>

  <div class="sum-box">
    <div id="sumLabel" class="sum-label">Сумма</div>
    <div id="sum" class="sum-value" inputmode="numeric" aria-labelledby="sumLabel">0</div>
  </div>

  <div class="actions">
    <button id="clearBtn" class="btn btn-secondary" type="button">
      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      Очистить
    </button>

    <button id="imageBtn" class="btn btn-primary" type="button">
      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="9" cy="9" r="2"/>
        <path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>
      </svg>
      Картинка
    </button>
  </div>

  <img id="preview" alt="Квадрат" hidden>

</main>

<script src="app.js"></script>

</body>
</html>
