<style>
/* ===== Палитра и шрифты (цвета меняются здесь) ===== */
:root{
  --bg:#15110E;          /* фон — тёмный эспрессо */
  --surface:#211B16;     /* карточки */
  --raised:#2D251F;      /* кнопки внутри карточек */
  --line:#3A3029;        /* тонкие линии */
  --text:#F6EEE4;        /* основной текст — сливочный */
  --muted:#A8998A;       /* подписи */
  --accent:#F77E2D;      /* фирменный оранжевый */
  --accent-press:#E06A1B;
  --on-accent:#1A0F07;   /* текст на оранжевом */
  --danger:#E0786B;
  --radius:14px;
  --font-display:"Unbounded", system-ui, sans-serif;
  --font-body:"Manrope", system-ui, -apple-system, sans-serif;
  --font-mono:"JetBrains Mono", "SF Mono", Menlo, monospace;
}

#app{
    width:100%;
    max-width:none;
    margin:0;
}

@media (min-width: 768px){
  #app{
    max-width:560px;
    margin:0 auto;
  }
}

body {
    font-family: var(--font-body);
    margin: 0;
    padding:
        calc(env(safe-area-inset-top) + 12px)
        16px
        calc(env(safe-area-inset-bottom) + 24px)
        16px;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

button, input{ font-family: inherit; }

:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* ===== Назад ===== */
.back {
    display: inline-flex;
    align-items: center;
    color: var(--text);
    cursor: pointer;
    margin-bottom: 12px;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 18px 10px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    transition: transform .12s ease, background .12s ease;
}
.back:active{ transform: scale(0.96); background: var(--raised); }

/* ===== Участник ===== */
#participantBar{
    background: var(--surface);
    border-radius: var(--radius);
    padding: 12px;
    margin: 0 0 18px;
}
#participantBar > div:first-child{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
}

#participantBar .row{
    display:flex;
    gap:8px;
    align-items:center;
}

#participantInput{
    flex:1;
    min-width: 0;
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    -webkit-user-select: text;
    user-select: text;
}
#participantInput::placeholder{ color: #7A6D61; }
#participantInput:focus{ outline: none; border-color: var(--accent); }

#participantBtn{
    width:auto;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 700;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: transparent;
    color: var(--accent);
    cursor:pointer;
    white-space:nowrap;
    transition: transform .12s ease, background .12s ease;
}
#participantBtn:active{ transform: scale(0.96); background: rgba(247,126,45,.14); }

/* ===== Шаги (блюдо 1–4) ===== */
#stepRail{
    display:flex;
    align-items:center;
    gap:10px;
    margin: 4px 2px 10px;
}
#stepBars{
    display:flex;
    gap:4px;
    flex:1;
}
#stepBars span{
    flex:1;
    height:4px;
    border-radius:2px;
    background: var(--line);
    transition: background .25s ease;
}
#stepBars span.done{ background: var(--accent); }
#stepBars span.current{ background: var(--text); }
#stepText{
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

/* ===== Заголовок раздела ===== */
h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-align: left;
    margin: 0 2px 12px;
}

/* ===== Список блюд ===== */
.list-container {position: relative; min-height: 200px;}
.item {
    padding: 16px 18px;
    margin: 0 0 8px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid transparent;
    font-size: 17px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    user-select: none;
    transition: transform .12s ease, background .2s ease, border-color .2s ease;
    animation: itemIn .32s ease both;
}
.item:nth-child(2){ animation-delay: .03s; }
.item:nth-child(3){ animation-delay: .06s; }
.item:nth-child(4){ animation-delay: .09s; }
.item:nth-child(5){ animation-delay: .12s; }
.item:nth-child(6){ animation-delay: .15s; }
.item:nth-child(7){ animation-delay: .18s; }
.item:active{ transform: scale(0.98); background: var(--raised); }
.item.selected {background: var(--accent); color: var(--on-accent);}

@keyframes itemIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: none; }
}

/* ===== Кнопки ===== */
button.main {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    border:none;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--on-accent);
    margin-top: 12px;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
}
button.main:active { transform: scale(0.98); background: var(--accent-press); }

#resetBtn {
    margin-top: 14px;
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(224,120,107,.4);
}
#resetBtn:active { background: rgba(224,120,107,.12); }

@media (hover:hover){
    .item:hover{ border-color: var(--line); }
    button.main:hover{ background: #FF9150; }
    #resetBtn:hover{ background: rgba(224,120,107,.1); }
    .back:hover, #participantBtn:hover{ background: var(--raised); }
}

/* ===== Превью чека — бумажная лента с «оторванным» краем ===== */
#preview{
    margin-top:24px;
    text-align:center;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.45));
}
#preview img{
    width:260px;
    background:#fff;
    border-radius:4px 4px 0 0;
    display:inline-block;
    vertical-align: top;
    -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
    mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
}

canvas { display:none; }

@media (max-width:480px){
  .item { font-size:16px; padding:15px 16px; }
  h2 { font-size:20px; }
  #preview img{ width:240px; }
  #participantInput { font-size:16px; }
}

/* ===== Блок «Время на чеке» ===== */
#timeCard{
  background: var(--surface);
  border-radius: var(--radius);
  padding:14px 12px 12px;
  margin-top:12px;
}

#timeCardHead{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:6px;
  padding: 0 2px;
}

#timeLabel{
  font-size:12px;
  font-weight:600;
  color: var(--muted);
  letter-spacing:.08em;
  text-transform: uppercase;
}

#timeBadge{
  font-size:13px;
  color: var(--accent);
  font-weight:700;
  min-width:52px;
  text-align:right;
  font-variant-numeric: tabular-nums;
}

#timeClock{
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size:40px;
  font-weight:600;
  text-align:center;
  letter-spacing:.02em;
  margin-bottom:12px;
}

#chipRow{
  display:flex;
  gap:6px;
  justify-content:space-between;
}

.chip{
  flex:1;
  background: var(--raised);
  color: var(--text);
  border:none;
  padding:11px 0;
  border-radius:10px;
  font-family: var(--font-mono);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:transform .12s ease, background .12s ease;
}
.chip:active{ transform:scale(0.92); background: var(--line); }
.chip.now{
  background:transparent;
  border:1px solid var(--line);
  color: var(--muted);
  font-family: var(--font-body);
  font-size:12px;
  flex:1.3;
}
.chip.now.is-live{
  border-color: var(--accent);
  color: var(--accent);
}

#manualRow{
  display:flex;
  gap:6px;
  margin-top:8px;
}

#customOffset{
  flex:1;
  min-width:0;
  background: var(--bg);
  color: var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  font-size:16px;
  text-align:center;
  -webkit-user-select: text;
  user-select: text;
}
#customOffset::placeholder{ color:#7A6D61; font-size:14px; }
#customOffset:focus{ outline:none; border-color: var(--accent); }

#applyCustom{
  background: var(--raised);
  color: var(--accent);
  border:none;
  border-radius:10px;
  padding:10px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}
#applyCustom:active{ transform:scale(0.94); }

/* Запрет масштабирования и выделения */
html,
body{
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
}

*{
    -webkit-tap-highlight-color: transparent;
}

@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; }
}
</style>

</head>

  <div id="timeCard">

</div>

<div id="preview"></div>

// ===== Внесение имени =====
function applyParticipant(){
  const val = document.getElementById("participantInput").value.trim();
  participant = val;
  updateReceiptPreview();
}

// Enter в поле = "Внести"
document.addEventListener("keydown", (e) => {
  const el = document.activeElement;
  if (el && el.id === "participantInput" && e.key === "Enter") {
    e.preventDefault();
    applyParticipant();
  }
});

// ===== Рендер страницы =====
function renderPage(page){
  // Если вернулись из финала — возвращаем меню
  setFinalMode(false);
  currentPage = page;

  const listDiv = document.getElementById("list");
  listDiv.innerHTML = "";
  document.getElementById("title").textContent = page;

  (pages[page] || []).forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    // Название для ОТОБРАЖЕНИЯ НА СТРАНИЦЕ (список блюд)
    div.textContent = (fullNames[item] || item);
    if(selectedWords.includes(item)) div.classList.add("selected");
    div.onclick = () => selectItem(page, item);
    listDiv.appendChild(div);
  });

  updateStepRail();
  updateReceiptPreview();
}

// ===== Индикатор шагов: сколько блюд уже выбрано из 4 =====
function updateStepRail(){
  const count = selectedWords.length;
  document.querySelectorAll("#stepBars span").forEach((bar, i) => {
    bar.classList.toggle("done", i < count);
    bar.classList.toggle("current", i === count);
  });
  document.getElementById("stepText").textContent =
    count >= 4 ? "Готово" : `Блюдо ${count + 1} из 4`;
}

// ===== Общая отрисовка чека (и для превью, и для сохранения) =====
function renderReceiptToCanvas({ download = false } = {}) {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // Увеличиваем качество скачиваемого чека в 2 раза
  const scale = download ? 2 : 1;

  const width = 300;
  const lineHeight = 28;

  // запас под лого + заголовок
  const topPadding = 198;
  const bottomPadding = 120;
  const emptyLines = 1;

  const height = topPadding + bottomPadding + (selectedWords.length + emptyLines + 1) * lineHeight;
  canvas.width = Math.round(width * scale);
  canvas.height = Math.round(height * scale);
  // Рисуем в «логических» пикселях, но с увеличенной плотностью
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  // фон
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, width, height);

  // ===== Лого (если есть) =====
  // Рисуем в верхней части, по центру
  if (logoImg && logoImg.complete && logoImg.naturalWidth > 0) {
    const maxW = 280;
    const maxH = 140;
    const scale = Math.min(maxW / logoImg.naturalWidth, maxH / logoImg.naturalHeight);
    const drawW = Math.round(logoImg.naturalWidth * scale);
    const drawH = Math.round(logoImg.naturalHeight * scale);
    const x = Math.round((width - drawW) / 2);
    const y = 10;
    ctx.drawImage(logoImg, x, y, drawW, drawH);
  }

  // шапка: убрано слово "Сок"
  ctx.fillStyle = "#000";

  // позиции
  ctx.textAlign = "left";
  ctx.font = "18px monospace";
  let y = topPadding;

  selectedWords.forEach(item => {
    // Название для ЧЕКА (печать в canvas)
    const text = fullNames[item] || item;
    const priceStr = (prices[item] ?? 0) + "₽";
    const maxWidth = width - 20;

    let dotsCount = Math.floor(
      (maxWidth - ctx.measureText(text).width - ctx.measureText(priceStr).width) /
      ctx.measureText(".").width
    );
    if(dotsCount < 1) dotsCount = 1;
    const dots = ".".repeat(dotsCount);

    ctx.fillText(text + dots + priceStr, 10, y);
    y += lineHeight;
  });

  // линия + итог
  ctx.beginPath();
  ctx.moveTo(10, y);
  ctx.lineTo(width - 10, y);
  ctx.lineWidth = 1;
  ctx.stroke();

  y += lineHeight;

  const sumText = "Итого";
  const totalSum = selectedWords.reduce((sum, item) => sum + (prices[item] || 0), 0);
  const sumPrice = totalSum + "₽";

  let dotsCount = Math.floor(
    (width - 20 - ctx.measureText(sumText).width - ctx.measureText(sumPrice).width) /
    ctx.measureText(".").width
  );
  if(dotsCount < 1) dotsCount = 1;
  const dots = ".".repeat(dotsCount);

  ctx.fillText(sumText + dots + sumPrice, 10, y);
  y += lineHeight;

  // “пустота” как в настоящем чеке
  for(let i = 0; i < emptyLines; i++) y += lineHeight;

  // футер
 const now = getOffsetTime();
  ctx.textAlign = "center";
  ctx.font = "16px sans-serif";
  ctx.fillText(`${now.toLocaleDateString()} ${now.toLocaleTimeString()}`, width / 2, y + 10);
  // Спасибо: с именем или без
  ctx.font = "18px sans-serif";
  if (participant && participant.trim()) {
    const name = participant.trim().toUpperCase();
    ctx.fillText(`Спасибо, ${name},`, width / 2, y + 40);
    ctx.fillText("за выбор нашего ресторана", width / 2, y + 60);
  } else {
    ctx.fillText(`Спасибо`, width / 2, y + 40);
    ctx.fillText("за выбор нашего ресторана", width / 2, y + 60);
  }

  if (download) {
    const link = document.createElement("a");
    link.download = "cheque.jpg";
    link.href = canvas.toDataURL("image/jpeg", 0.95);
    link.click();
    return;
  }

  // Превью
  const dataUrl = canvas.toDataURL("image/jpeg");
  document.getElementById("preview").innerHTML = `<img src="${dataUrl}" alt="Чек">`;
}

// ===== Обновление превью чека (всегда) =====
function updateReceiptPreview(){
  renderReceiptToCanvas({ download: false });
}

// ===== Режим финала: прячем меню, превью занимает его место =====
const _previewEl = document.getElementById("preview");
const _previewOriginalParent = _previewEl.parentNode;
const _previewOriginalNext = _previewEl.nextSibling;

function setFinalMode(isFinal){
  const titleEl = document.getElementById("title");
  const listEl = document.getElementById("list");

  if(isFinal){
    // прячем заголовок и список
    titleEl.style.display = "none";
    listEl.style.display = "none";

    // переносим превью туда, где было меню (сразу под индикатором шагов)
    const stepRail = document.getElementById("stepRail");
    stepRail.insertAdjacentElement("afterend", _previewEl);

    // аккуратный отступ сверху
    _previewEl.style.marginTop = "12px";
  } else {
    // возвращаем меню
    titleEl.style.display = "";
    listEl.style.display = "";

    // возвращаем превью на исходное место (как было в верстке)
    if (_previewOriginalNext) _previewOriginalParent.insertBefore(_previewEl, _previewOriginalNext);
    else _previewOriginalParent.appendChild(_previewEl);

    _previewEl.style.marginTop = "";
  }
}

// ===== Выбор элемента =====
function selectItem(currentPageLocal, item) {
  if (selectedWords.length > historyStack.length) return;

  selectedWords.push(item);
  updateReceiptPreview();

  // После выбора 4-го блюда прячем меню и показываем чек на его месте
  if (selectedWords.length >= 4) {
    updateStepRail();
    setFinalMode(true);
    copyToClipboard();
    return;
  }

  const nextPage = transition[currentPageLocal]?.[item];

  if (nextPage) {
    historyStack.push(currentPageLocal);
    renderPage(nextPage);
  } else {
    copyToClipboard();
  }
}

function copyToClipboard(){
  let text = "Сок\n\n";
  selectedWords.forEach(w => { text += (fullNames[w] || w) + " " + (prices[w] ?? 0) + "₽\n"; });
  text += `\nСпасибо за участие\n${(participant || "").toUpperCase()}`;
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
}

function goBack() {
  if (selectedWords.length === 0) return;

  if (selectedWords.length > historyStack.length) {
    selectedWords.pop();
      updateReceiptPreview();
    renderPage(currentPage);
    return;
  }

  selectedWords.pop();
  const prevPage = historyStack.pop() || "Закуски";
  updateReceiptPreview();
  renderPage(prevPage);
}

// ===== Сброс =====
function resetPage() {
  selectedWords = [];
  historyStack = [];
  participant = "";
  setFinalMode(false);
  const input = document.getElementById("participantInput");
  if (input) input.value = "";
  renderPage("Закуски");
}

// ===== Генерация чека (скачать) =====
function generateReceipt(){
  if(selectedWords.length === 0) return alert("Выберите хотя бы одно блюдо");
  renderReceiptToCanvas({ download: true });
}

// ===== Инициализация запускается в самом конце файла =====
// (после того как определены getOffsetTime/timeOffset, см. ниже)

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("./sw.js");

      registration.addEventListener("updatefound", () => {
        const worker = registration.installing;
        if (!worker) return;

        worker.addEventListener("statechange", () => {
          if (
            worker.state === "installed" &&
            navigator.serviceWorker.controller
          ) {
            if (confirm("Доступна новая версия приложения. Обновить?")) {
              window.location.reload();
            }
          }
        });
      });
    } catch (e) {
      console.error("Service Worker error:", e);
    }
  });
}
let timeOffset = parseInt(localStorage.getItem("timeOffset") || "0", 10);
if (!Number.isFinite(timeOffset)) timeOffset = 0;

// ===== ПРИМЕНЕНИЕ СМЕЩЕНИЯ В ЧЕК =====
// Единый источник правды: timeOffset (минуты, может быть отрицательным)
function getOffsetTime(){
    const now = new Date();
    if(timeOffset !== 0) now.setMinutes(now.getMinutes() + timeOffset);
    return now;
}

// ===== ИНИЦИАЛИЗАЦИЯ БЛОКА ВРЕМЕНИ =====
const timeClockEl = document.getElementById("timeClock");
const timeBadgeEl = document.getElementById("timeBadge");
const timeNowBtn = document.getElementById("timeNow");
const customInput = document.getElementById("customOffset");
const applyCustomBtn = document.getElementById("applyCustom");

function pad(n){ return n.toString().padStart(2, "0"); }

// Обновляет часы и бейдж смещения, перерисовывает превью чека
function refreshTimeUI(){
  const t = getOffsetTime();
  timeClockEl.textContent = `${pad(t.getHours())}:${pad(t.getMinutes())}`;

  if(timeOffset === 0){
    timeBadgeEl.textContent = "Сейчас";
    timeNowBtn.classList.add("is-live");
  } else {
    const sign = timeOffset > 0 ? "+" : "−";
    timeBadgeEl.textContent = `${sign}${Math.abs(timeOffset)} мин`;
    timeNowBtn.classList.remove("is-live");
  }

  localStorage.setItem("timeOffset", timeOffset);
  updateReceiptPreview();
}

function setOffset(newValue){
  timeOffset = newValue;
  customInput.value = "";
  refreshTimeUI();
  if (navigator.vibrate) navigator.vibrate(15);
}

// Чипы +5/-5/+15/-15 добавляют смещение к текущему значению
document.querySelectorAll(".chip[data-delta]").forEach(btn => {
  btn.addEventListener("click", () => {
    setOffset(timeOffset + parseInt(btn.dataset.delta, 10));
  });
});

// «Сейчас» — сброс смещения в 0
timeNowBtn.addEventListener("click", () => setOffset(0));

// Ручной ввод точного смещения (можно со знаком минус)
function applyCustomOffset(){
  const val = parseInt(customInput.value, 10);
  setOffset(Number.isFinite(val) ? val : 0);
}
applyCustomBtn.addEventListener("click", applyCustomOffset);
customInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); applyCustomOffset(); }
});

// Держим часы «живыми», пока открыта страница
setInterval(refreshTimeUI, 15000);

// Запрет увеличения страницы двойным тапом (iPhone)
let lastTouchEnd = 0;

document.addEventListener("touchend", function (event) {
    const now = Date.now();

    // Кнопки, блюда и поля не трогаем — иначе быстрый второй тап
    // (например, «+5» два раза подряд) терялся. Зум на них и так
    // отключён через touch-action: manipulation.
    const interactive = event.target.closest && event.target.closest("button, input, .item, .back");

    if (!interactive && now - lastTouchEnd <= 300) {
        event.preventDefault();
    }

    lastTouchEnd = now;
}, { passive: false });

// ===== Старт =====
renderPage("Закуски");
refreshTimeUI(); // выставляет часы и делает первый рендер чека
    
</script>
